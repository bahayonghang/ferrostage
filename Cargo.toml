[workspace]
resolver = "3"
exclude = [
    "vendor/gpui",
    "vendor/pulp",
    "vendor/metal",
    "vendor/cosmic-text",
    "vendor/harfrust",
    "vendor/accesskit_windows",
    "vendor/accesskit_unix",
    "vendor/accesskit_atspi_common",
    "vendor/atspi",
    "vendor/atspi-connection",
    "vendor/atspi-common",
    "vendor/atspi-proxies",
    "vendor/zbus-lockstep",
    "vendor/zbus-lockstep-macros",
    "vendor/ashpd",
    "vendor/oo7",
    "vendor/notify-rust",
]
members = [
    "crates/ferrostage-app",
    "crates/ferrostage-ui",
    "crates/ferrostage-core",
    "crates/ferrostage-document",
    "crates/ferrostage-pdf",
    "crates/ferrostage-render",
    "crates/ferrostage-media",
    "crates/ferrostage-media-helper",
    "crates/ferrostage-platform",
    "crates/ferrostage-settings",
]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.99"

[workspace.dependencies]
ferrostage-core = { path = "crates/ferrostage-core" }
ferrostage-document = { path = "crates/ferrostage-document" }
ferrostage-pdf = { path = "crates/ferrostage-pdf" }
ferrostage-render = { path = "crates/ferrostage-render" }
ferrostage-media = { path = "crates/ferrostage-media" }
ferrostage-platform = { path = "crates/ferrostage-platform" }
ferrostage-settings = { path = "crates/ferrostage-settings" }
ferrostage-ui = { path = "crates/ferrostage-ui" }
gpui = { path = "vendor/gpui", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.23.3", default-features = false }
image = { version = "=0.25.10", default-features = false }
gstreamer = "=0.25.4"
gstreamer-app = "=0.25.2"
gstreamer-video = "=0.25.2"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
uuid = { version = "=1.28.0", features = ["v5"] }

# Latest stable crates.io releases as of 2026-10-14.
# Heavy native / GPUI crates are pinned here but not linked by the default build.
# See docs/adr/ADR-001-gpui-from-zed-tag.md and docs/adr/ADR-002-pdf-backends.md.
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
lopdf = "0.45.0"
proptest = "1.12.0"
# notify 8.2.0 is the latest stable (9.0.0 is still a release candidate).
notify = "8.2.0"
# Reviewed safe Windows monitor adapters; target-gated by platform.
winsafe = { version = "=0.0.29", features = ["gdi", "advapi"] }
# Optional dynamic bindings only; the application supplies the PDFium runtime.
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881"] }
# hayro-syntax 0.8.0 (MSRV 1.92). Not linked until the syntax PoC calls a stable API.
# gpui-kit / gpui-component 0.7.3 (2026-10-12), built on gpui-pre 0.3.9.
# Zed GPUI git pin: zed-industries/zed tag v1.23.3 (published 2026-10-12).
# Do not depend on crates.io `gpui` 0.2.x.

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "vendor/gpui" }

[patch.crates-io]
pulp = { path = "vendor/pulp" }
metal = { path = "vendor/metal" }
cosmic-text = { path = "vendor/cosmic-text" }
harfrust = { path = "vendor/harfrust" }
accesskit_windows = { path = "vendor/accesskit_windows" }
accesskit_unix = { path = "vendor/accesskit_unix" }
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
atspi = { path = "vendor/atspi" }
atspi-common = { path = "vendor/atspi-common" }
atspi-proxies = { path = "vendor/atspi-proxies" }
zbus-lockstep = { path = "vendor/zbus-lockstep" }
zbus-lockstep-macros = { path = "vendor/zbus-lockstep-macros" }
ashpd = { path = "vendor/ashpd" }
oo7 = { path = "vendor/oo7" }
notify-rust = { path = "vendor/notify-rust" }
