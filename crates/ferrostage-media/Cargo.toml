[package]
name = "ferrostage-media"
description = "Offscreen media frames shared by both windows. No child HWNDs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
native-tests = []

[dependencies]
ferrostage-core.workspace = true
image = { workspace = true, features = ["gif", "webp"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
ferrostage-pdf.workspace = true

[lints]
workspace = true

[[example]]
name = "ipc_stall"
required-features = ["native-tests"]
