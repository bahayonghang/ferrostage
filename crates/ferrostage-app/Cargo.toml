[package]
name = "ferrostage-app"
description = "FerroStage native presenter and settings validation CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "ferrostage"
path = "src/main.rs"

[features]
default = []
media = ["ferrostage-ui/media"]
pdfium = ["ferrostage-render/pdfium", "ferrostage-ui/pdfium"]
gpui = ["ferrostage-ui/gpui"]

[dependencies]
ferrostage-render.workspace = true
ferrostage-pdf.workspace = true
ferrostage-core.workspace = true
ferrostage-platform.workspace = true
clap.workspace = true
ferrostage-settings.workspace = true
ferrostage-ui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
embed-resource = "=3.0.12"

[lints]
workspace = true
