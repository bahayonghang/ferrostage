[package]
name = "ferrostage-linux-dependency-check"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "lib.rs"

[features]
default = ["accesskit_unix/async-io"]
tokio = ["accesskit_unix/tokio", "atspi/tokio"]

[dependencies]
accesskit_unix = { path = "../../../../../../../vendor/accesskit_unix", default-features = false }

atspi = { path = "../../../../../../../vendor/atspi" }

[patch.crates-io]
accesskit_unix = { path = "../../../../../../../vendor/accesskit_unix" }
accesskit_atspi_common = { path = "../../../../../../../vendor/accesskit_atspi_common" }
atspi = { path = "../../../../../../../vendor/atspi" }
atspi-common = { path = "../../../../../../../vendor/atspi-common" }
atspi-proxies = { path = "../../../../../../../vendor/atspi-proxies" }
zbus-lockstep = { path = "../../../../../../../vendor/zbus-lockstep" }
zbus-lockstep-macros = { path = "../../../../../../../vendor/zbus-lockstep-macros" }
atspi-connection = { path = "../../../../../../../vendor/atspi-connection" }
