role = "none"

[general]
debug_overlay = false
language = "zh-CN"
recent_files = []
recent_files_limit = 10
reopen_last_document = false
theme = "system"

[hot_reload]
debounce_ms = 300
enabled = true

[keybindings]
blank_black = ["B"]
blank_white = ["W"]
jump = ["G"]
next = [
    "PageDown",
    "Space",
    "Right",
]
previous = [
    "PageUp",
    "Backspace",
    "Left",
]
start_presentation = ["F5"]
stop_presentation = ["Escape"]
swap_screens = ["S"]
toggle_laser = ["L"]
toggle_pen = ["P"]

[pointer]
highlighter_alpha = 0.5
laser_color_bgra = [
    0,
    0,
    255,
    255,
]
laser_radius_norm = 0.008
pen_color_bgra = [
    0,
    0,
    255,
    255,
]
pen_width_norm = 0.004

[presenter]
grid_columns = 4
grid_visible_pages = 16
next_slide_ratio = 0.35
notes_font_scale = 1.0
notes_ratio = 0.4
show_clock = true
show_thumbnail_strip = true

[timer]
mode = "count_down"
target_minutes = 45
warn_red_remaining_min = 3
warn_yellow_remaining_min = 10
