[package]
name = "gpui"
version = "0.2.2"
edition.workspace = true
authors = ["Nathan Sobo <nathan@zed.dev>"]
description = "Zed's GPU-accelerated UI framework"
repository = "https://github.com/zed-industries/zed"
publish = true
license = "Apache-2.0"
homepage = "https://gpui.rs"
readme = "README.md"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]


[lints]
workspace = true

[features]
default = ["font-kit", "wayland", "x11", "windows-manifest"]
test-support = [
    "leak-detection",
    "collections/test-support",
    "http_client/test-support",
    "wayland",
    "x11",
    "proptest",
]
bench-support = ["profiler", "dep:criterion", "dep:bench_metrics"]
# Preserve the published feature name while consumers migrate to `bench-support`.
bench = ["bench-support"]
inspector = ["gpui_macros/inspector"]
leak-detection = ["backtrace"]
wayland = []
x11 = [
    "scap?/x11",
]
screen-capture = [
    "scap",
]
windows-manifest = ["dep:embed-resource"]
profiler = ["dep:hdrhistogram"]
stacker = ["dep:stacksafe"]

[lib]
path = "src/gpui.rs"

[dependencies]
accesskit.workspace = true
anyhow.workspace = true
async-task.workspace = true
backtrace = { workspace = true, optional = true }
bitflags.workspace = true

collections.workspace = true
bench_metrics = { workspace = true, optional = true }
criterion = { workspace = true, optional = true }
ctor.workspace = true
derive_more.workspace = true
etagere.workspace = true
futures.workspace = true
futures-concurrency.workspace = true
gpui_macros.workspace = true
gpui_shared_string.workspace = true
http_client.workspace = true
image.workspace = true
inventory.workspace = true
itertools.workspace = true
log.workspace = true
num_cpus = "1.13"
parking = "2.0.0"
parking_lot.workspace = true
postage.workspace = true
proptest = { workspace = true, optional = true }
chrono.workspace = true
profiling.workspace = true
rand.workspace = true
raw-window-handle.workspace = true
regex.workspace = true
refineable.workspace = true
scheduler.workspace = true
resvg.workspace = true
usvg.workspace = true
skrifa.workspace = true
util_macros.workspace = true
schemars.workspace = true
seahash = "4.1"
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
stacksafe = { workspace = true, optional = true }
strum.workspace = true
sum_tree.workspace = true
taffy = "=0.13.0"
thiserror.workspace = true
gpui_util.workspace = true
hdrhistogram = { workspace = true, optional = true }
waker-fn = "1.2.0"
lyon = "1.0"
pin-project = "1.1.10"
spin = "0.10.0"
pollster.workspace = true
url.workspace = true
uuid.workspace = true
web-time.workspace = true
heapless.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Workspace inheritance would re-enable defaults, including blocking channel synchronization.
async-channel = { version = "2.5.0", default-features = false }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
async-channel.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }


[target.'cfg(target_os = "macos")'.dependencies]
core-video.workspace = true
objc2-core-foundation.workspace = true
objc2-core-video.workspace = true
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }
log.workspace = true
objc2 = { workspace = true, optional = true }
objc2-metal = { version = "0.3", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "windows"))'.dependencies]
scap = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc.workspace = true


[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_WindowsProgramming"] }


[dev-dependencies]
backtrace.workspace = true
bench_metrics = { workspace = true, features = ["test-support"] }
collections = { workspace = true, features = ["test-support"] }
env_logger.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
gpui_util = { workspace = true }
lyon = { version = "1.0", features = ["extra"] }
rand.workspace = true
scheduler = { workspace = true, features = ["test-support"] }
unicode-segmentation = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
http_client = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
reqwest_client = { workspace = true, features = ["test-support"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = ["console"] }

[build-dependencies]
embed-resource = { version = "3.0", optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.72"

[package.metadata.cargo-shear]
ignored = [
    "bindgen",
    "font-kit",
    "getrandom",
    "objc2",
    "objc2-metal",
]
ignored-paths = ["src/_ownership_and_data_flow.rs"]

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "move_entity_between_windows"
path = "examples/move_entity_between_windows.rs"

[[example]]
name = "image"
path = "examples/image/image.rs"

[[example]]
name = "input"
path = "examples/input.rs"

[[example]]
name = "on_window_close_quit"
path = "examples/on_window_close_quit.rs"

[[example]]
name = "window_movable"
path = "examples/window_movable.rs"

[[example]]
name = "opacity"
path = "examples/opacity.rs"

[[example]]
name = "pattern"
path = "examples/pattern.rs"

[[example]]
name = "set_menus"
path = "examples/set_menus.rs"

[[example]]
name = "system_notifications"
path = "examples/system_notifications.rs"


[[example]]
name = "shadow"
path = "examples/shadow.rs"

[[example]]
name = "svg"
path = "examples/svg/svg.rs"

[[example]]
name = "tab_stop"
path = "examples/tab_stop.rs"

[[example]]
name = "text"
path = "examples/text.rs"

[[example]]
name = "text_wrapper"
path = "examples/text_wrapper.rs"

[[example]]
name = "tree"
path = "examples/tree.rs"

[[example]]
name = "uniform_list"
path = "examples/uniform_list.rs"

[[example]]
name = "window_shadow"
path = "examples/window_shadow.rs"

[[example]]
name = "grid_layout"
path = "examples/grid_layout.rs"

[[example]]
name = "list_example"
path = "examples/list_example.rs"

[[example]]
name = "mouse_pressure"
path = "examples/mouse_pressure.rs"

[[example]]
name = "a11y"
path = "examples/a11y.rs"

[[example]]
name = "view_example"
path = "examples/view_example/view_example_main.rs"

[workspace]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
"accesskit" = { "version" = "0.24.0", "features" = ["enumn"] }
"anyhow" = "1.0.86"
"async-channel" = "2.5.0"
"async-task" = "4.7"
"backtrace" = "0.3"
"bench_metrics" = { "git" = "https://github.com/zed-industries/zed", "tag" = "v1.23.3" }
"bitflags" = "2.6.0"
"chrono" = { "version" = "0.4", "features" = ["serde"] }
"collections" = { "version" = "0.1.0", "git" = "https://github.com/zed-industries/zed", "tag" = "v1.23.3" }
"core-video" = { "version" = "0.5.2", "features" = ["metal"] }
"criterion" = { "version" = "0.8.2", "features" = ["html_reports"] }
"ctor" = "1.0.12"
"derive_more" = { "version" = "2.1.1", "features" = ["add", "add_assign", "deref", "deref_mut", "display", "from", "from_str", "mul", "mul_assign", "not"] }
"env_logger" = "0.11"
"etagere" = "0.2"
"futures" = "0.3.34"
"futures-concurrency" = "7.7.1"
"gpui_macros" = { "git" = "https://github.com/zed-industries/zed", "tag" = "v1.23.3" }
"gpui_platform" = { "default-features" = false, "git" = "https://github.com/zed-industries/zed", "tag" = "v1.23.3" }
"gpui_shared_string" = { "git" = "https://github.com/zed-industries/zed", "tag" = "v1.23.3" }
"gpui_util" = { "git" = "https://github.com/zed-industries/zed", "tag" = "v1.23.3" }
"hdrhistogram" = { "version" = "7", "default-features" = false }
"heapless" = "0.9.2"
"http_client" = { "git" = "https://github.com/zed-industries/zed", "tag" = "v1.23.3" }
"image" = { "version" = "0.25.1", "default-features" = false, "features" = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
"inventory" = "0.3.19"
"itertools" = "0.14.0"
"libc" = "0.2"
"log" = { "version" = "0.4.16", "features" = ["kv_unstable_serde", "serde"] }
"objc2" = "0.6"
"objc2-core-foundation" = { "version" = "=0.3.2", "default-features" = false }
"objc2-core-video" = { "version" = "=0.3.2", "default-features" = false, "features" = ["CVBuffer", "CVImageBuffer"] }
"parking_lot" = "0.12.1"
"pollster" = "0.4.0"
"postage" = { "version" = "0.5", "features" = ["futures-traits"] }
"profiling" = "1"
"proptest" = { "git" = "https://github.com/proptest-rs/proptest", "rev" = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", "features" = ["attr-macro"] }
"rand" = "0.9"
"raw-window-handle" = "0.6"
"refineable" = { "git" = "https://github.com/zed-industries/zed", "tag" = "v1.23.3" }
"regex" = "1.5"
"reqwest_client" = { "git" = "https://github.com/zed-industries/zed", "tag" = "v1.23.3" }
"resvg" = { "version" = "=0.48.1", "default-features" = false, "features" = ["text", "system-fonts", "memmap-fonts", "raster-images", "svgz"] }
"scap" = { "git" = "https://github.com/zed-industries/scap", "rev" = "4afea48c3b002197176fb19cd0f9b180dd36eaac", "default-features" = false, "package" = "zed-scap", "version" = "0.0.8-zed" }
"scheduler" = { "git" = "https://github.com/zed-industries/zed", "tag" = "v1.23.3" }
"schemars" = { "version" = "1.0", "features" = ["indexmap2"] }
"serde" = { "version" = "1.0.221", "features" = ["derive", "rc"] }
"serde_json" = { "version" = "1.0.144", "features" = ["preserve_order", "raw_value"] }
"slotmap" = "1.0.6"
"smallvec" = { "version" = "1.6", "features" = ["union", "const_new"] }
"stacksafe" = "1.0"
"strum" = { "version" = "0.28", "features" = ["derive"] }
"sum_tree" = { "git" = "https://github.com/zed-industries/zed", "tag" = "v1.23.3" }
"thiserror" = "2.0.12"
"unicode-segmentation" = "1.10"
"url" = "2.2"
"usvg" = { "version" = "=0.48.1", "default-features" = false }
"util_macros" = { "git" = "https://github.com/zed-industries/zed", "tag" = "v1.23.3" }
"uuid" = { "version" = "1.1.2", "features" = ["v4", "v5", "v7", "serde"] }
"wasm-bindgen" = "0.2.120"
"web-time" = "1.1.0"
"windows" = { "version" = "0.62", "features" = ["Data_Xml_Dom", "Foundation_Numerics", "Globalization_DateTimeFormatting", "Storage_Search", "Storage_Streams", "System_Threading", "UI_Notifications", "UI_ViewManagement", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite", "Win32_Graphics_DirectManipulation", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Hlsl", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_RestartManager", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Media"] }
"skrifa" = { "version" = "=0.44.0", "default-features" = false, "features" = ["std"] }

[workspace.lints.rust]
"unexpected_cfgs" = { "level" = "allow" }

[workspace.lints.clippy]
"dbg_macro" = "deny"
"todo" = "deny"
"declare_interior_mutable_const" = "deny"
"redundant_clone" = "deny"
"disallowed_methods" = "deny"
"style" = { "level" = "allow", "priority" = -1 }
"type_complexity" = "allow"
"let_underscore_future" = "allow"
"single_range_in_vec_init" = "allow"
"too_many_arguments" = "allow"
"large_enum_variant" = "allow"
"nonminimal_bool" = "allow"

[patch.crates-io]
harfrust = { path = "../harfrust" }
pulp = { path = "../pulp" }
metal = { path = "../metal" }
cosmic-text = { path = "../cosmic-text" }

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "." }
