[package]
name = "ferrostage-gpui-maintenance-candidate"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace]
exclude = ["vendor/gpui", "vendor/pulp", "vendor/metal", "vendor/cosmic-text", "validation/fontdb"]

[dependencies]
gpui = { path = "vendor/gpui", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.23.3", default-features = false }

[dev-dependencies]
image = { "version" = "=0.25.10", "default-features" = false, "features" = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
exr = "=1.74.2"
paste = { package = "pastey", version = "=0.2.3" }
cosmic-text = "=0.19.0"

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "vendor/gpui" }

[patch.crates-io]
pulp = { path = "vendor/pulp" }
metal = { path = "vendor/metal" }
cosmic-text = { path = "vendor/cosmic-text" }
