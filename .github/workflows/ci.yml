name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: fmt, clippy, test, deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cargo-deny
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets --locked
      - name: cargo-deny
        run: cargo deny --locked check

  pdfium-native:
    name: PDFium 7881 Windows fixtures
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: taiki-e/install-action@cargo-deny
      - name: Acquire verified runtime and complete notices
        shell: pwsh
        run: |
          $library = ./scripts/fetch-pdfium.ps1 -Destination "$env:RUNNER_TEMP/pdfium-7881"
          "FERROSTAGE_TEST_PDFIUM=$library" >> $env:GITHUB_ENV
      - name: Verify independent fixture reproducibility
        run: |
          python fixtures/pdf/generate.py
          git diff --exit-code -- fixtures/pdf
      - name: Native clippy
        run: cargo clippy -p ferrostage-pdf -p ferrostage-render -p ferrostage-document --features pdfium --all-targets --locked -- -D warnings
      - name: Feature-on fixture suite must run
        run: cargo test -p ferrostage-pdf -p ferrostage-render -p ferrostage-document --features pdfium --all-targets --locked
      - name: Native feature dependency license gate
        run: cargo deny --all-features --locked check
      - name: Native GPUI shell compile gate (does not launch windows)
        run: cargo build -p ferrostage-app --features gpui,pdfium,media --locked
      - name: Native GPUI shell lint
        run: cargo clippy -p ferrostage-app -p ferrostage-ui --features gpui,pdfium,media --all-targets --locked -- -D warnings
      - name: Headless GPUI window and entity regression (TestPlatform only)
        run: cargo test -p ferrostage-ui --features test-support --lib --locked
      - name: Normal native suite must fail with a missing runtime
        shell: pwsh
        run: |
          $env:FERROSTAGE_TEST_PDFIUM = "$env:RUNNER_TEMP/nonexistent-pdfium.dll"
          cargo test -p ferrostage-render --features pdfium --test native --locked 2>&1 | Tee-Object -FilePath native-missing.log
          if ($LASTEXITCODE -eq 0) { throw 'Native fixture suite incorrectly succeeded without PDFium' }
          if (-not (Select-String native-missing.log -SimpleMatch 'LibraryUnavailable' -Quiet)) { throw 'Unexpected native failure' }
          exit 0

  media-native:
    name: Isolated GStreamer and silent product media fixtures
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - name: Prepare only reviewed runtime and safe import libraries
        shell: pwsh
        run: ./scripts/prepare-media-runtime.ps1
      - name: Native helper build and strict lint
        shell: pwsh
        run: |
          ./scripts/media-native.ps1 -Action build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/media-native.ps1 -Action clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p ferrostage-media --example ipc_stall --features native-tests --locked
      - name: Real silent controller/helper, animation, missing-runtime and reap regressions
        shell: pwsh
        run: |
          $env:FERROSTAGE_TEST_MEDIA_HELPER = (Resolve-Path target/debug/ferrostage-media-helper.exe).Path
          $env:FERROSTAGE_TEST_MEDIA_RUNTIME = (Resolve-Path cache/media-runtime).Path
          cargo test -p ferrostage-media --features native-tests --locked
      - name: Media-enabled GUI must not import native media DLLs
        shell: pwsh
        run: |
          cargo build -p ferrostage-app --features gpui,pdfium,media --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check-media-imports.ps1 -Binary target/debug/ferrostage.exe
