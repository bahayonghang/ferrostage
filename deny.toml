# cargo-deny 0.20. Workspace crates are unpublished; GPL and AGPL stay banned
# so MuPDF and other copyleft PDF engines cannot be added by accident.

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
exceptions = [
    { crate = "arrayref@0.3.9", allow = ["BSD-2-Clause"] },
    { crate = "libbz2-rs-sys@0.2.5", allow = ["bzip2-1.0.6"] },
    { crate = "cbindgen@0.28.0", allow = ["MPL-2.0"] },
]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
private = { ignore = false }

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { crate = "mupdf" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
